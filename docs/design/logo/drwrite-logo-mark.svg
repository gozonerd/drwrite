<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#0d1117" stroke="#4ec9b0" stroke-width="3"/>

  <!-- "M" letter - left half of the MD -->
  <text x="24" y="82" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="52" fill="#4ec9b0">M</text>

  <!-- "D" letter - right half of the MD -->
  <text x="68" y="82" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="52" fill="#e6edf3">D</text>

  <!-- Subtle underline accent -->
  <line x1="28" y1="90" x2="100" y2="90" stroke="#4ec9b0" stroke-width="2" stroke-linecap="round"/>
</svg>
