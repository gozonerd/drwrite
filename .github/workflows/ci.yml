name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx}"

      - name: ESLint
        run: npx eslint --ext .ts,.tsx src/ --max-warnings 0

      - name: Unit & component tests
        run: npx vitest run

      - name: Coverage report
        run: npx vitest run --coverage

  build-windows:
    needs: lint-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build Windows installer
        run: npm run make

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: drwrite-windows
          path: out/make/squirrel.windows/

  build-mac:
    needs: lint-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build macOS DMG
        run: npm run make

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: drwrite-macos
          path: out/make/
